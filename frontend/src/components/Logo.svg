<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 300 915 640" fill="none">
  <defs>
    <!-- Premium Industrial Bone Gradient -->
    <linearGradient id="lg-bone-face" gradientUnits="userSpaceOnUse" x1="560" y1="354" x2="700" y2="885">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F4F2EC" />
      <stop offset="70%" stop-color="#E9E6DF" />
      <stop offset="100%" stop-color="#D6D1C4" />
    </linearGradient>

    <!-- Subtle Industrial Metallic Shine -->
    <linearGradient id="lg-shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Shapes Definition -->
    <g id="lg-shapes">
      <polygon points="499,354 605,609 532,641 490,546 374,764 474,767 220,882" />
      <polygon points="522,674 439,714 422,743 549,743" />
      <polygon points="613,631 543,663 586,764 517,767 718,878" />
      <polygon points="526,359 628,597 700,565 660,469 729,466" />
      <polygon points="1031,356 770,466 878,470 757,693 711,587 639,619 748,885" />
    </g>
    <clipPath id="lg-clip"><use href="#lg-shapes" /></clipPath>
  </defs>

  <!-- Vector Pieces in Theme Bone (#E9E6DF) with 1px Crisp Stroke -->
  <g class="lg-piece lg-piece--a">
    <polygon fill="url(#lg-bone-face)" stroke="#E9E6DF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="miter"
             points="499,354 605,609 532,641 490,546 374,764 474,767 220,882" />
  </g>
  <g class="lg-piece lg-piece--s">
    <polygon fill="url(#lg-bone-face)" stroke="#E9E6DF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="miter"
             points="522,674 439,714 422,743 549,743" />
  </g>
  <g class="lg-piece lg-piece--b">
    <polygon fill="url(#lg-bone-face)" stroke="#E9E6DF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="miter"
             points="613,631 543,663 586,764 517,767 718,878" />
  </g>
  <g class="lg-piece lg-piece--v1">
    <polygon fill="url(#lg-bone-face)" stroke="#E9E6DF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="miter"
             points="526,359 628,597 700,565 660,469 729,466" />
  </g>
  <g class="lg-piece lg-piece--v2">
    <polygon fill="url(#lg-bone-face)" stroke="#E9E6DF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="miter"
             points="1031,356 770,466 878,470 757,693 711,587 639,619 748,885" />
  </g>

  <!-- Subtle Surface Specular Highlight -->
  <g clip-path="url(#lg-clip)">
    <rect class="lg-shine" x="150" y="320" width="110" height="620" fill="url(#lg-shine-grad)" opacity="0.6" />
  </g>
</svg>
